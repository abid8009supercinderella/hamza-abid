<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilal Abid AI - Fast & Smart AI Assistant</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- Google AdSense Script Placeholder -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <style>
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .prose pre {
            background-color: #0f172a !important;
            padding: 1rem;
            border-radius: 0.75rem;
            border: 1px solid #1e293b;
            overflow-x: auto;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header Navigation -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 border-b border-slate-800/80 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-purple-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/25">
                BA
            </div>
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-300">Bilal Abid AI</h1>
                <p class="text-[11px] text-slate-400 font-medium">Free & Instant Public AI Q&A Engine</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Server Powered (Public Ready)
            </span>
        </div>
    </header>

    <!-- AdSense Top Banner Container -->
    <div class="max-w-4xl mx-auto w-full px-4 mt-4">
        <div class="p-3 border border-dashed border-slate-800 bg-slate-900/40 rounded-xl text-center">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <!-- Main Content Chat Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 flex flex-col justify-between">
        
        <!-- Chat Stream Box -->
        <div id="chat-box" class="chat-scroll flex-1 overflow-y-auto space-y-6 mb-6 pr-2 min-h-[420px]">
            <!-- Hero Welcome Card -->
            <div class="glass-panel p-8 rounded-3xl border border-slate-800/80 text-center space-y-4 shadow-2xl">
                <div class="inline-flex p-3 bg-indigo-500/10 rounded-2xl text-indigo-400 mb-2">
                    <i class="fa-solid fa-bolt text-2xl animate-bounce"></i>
                </div>
                <h2 class="text-3xl font-extrabold text-white tracking-tight">Ask Bilal Abid AI Anything</h2>
                <p class="text-slate-400 text-sm max-w-lg mx-auto leading-relaxed">Ask any question below! Answers are provided instantly powered by Vercel serverless backend.</p>
                
                <!-- Quick Starter Prompts -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4 max-w-2xl mx-auto text-left">
                    <button onclick="sendQuickPrompt('Explain Artificial Intelligence in 2 simple sentences.')" class="p-3.5 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-2xl text-xs text-slate-300 transition flex justify-between items-center group shadow-sm">
                        <span>⚡ What is Artificial Intelligence?</span>
                        <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-indigo-400 transition-transform group-hover:translate-x-1"></i>
                    </button>
                    <button onclick="sendQuickPrompt('Write a clean Python script to fetch data from an API.')" class="p-3.5 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-2xl text-xs text-slate-300 transition flex justify-between items-center group shadow-sm">
                        <span>💻 Python API Fetch Script</span>
                        <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-indigo-400 transition-transform group-hover:translate-x-1"></i>
                    </button>
                    <button onclick="sendQuickPrompt('Give me 5 proven tips for website SEO optimization.')" class="p-3.5 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-2xl text-xs text-slate-300 transition flex justify-between items-center group shadow-sm">
                        <span>🚀 SEO Tips for Websites</span>
                        <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-indigo-400 transition-transform group-hover:translate-x-1"></i>
                    </button>
                    <button onclick="sendQuickPrompt('Write a professional email asking for a project update.')" class="p-3.5 bg-slate-900/90 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 rounded-2xl text-xs text-slate-300 transition flex justify-between items-center group shadow-sm">
                        <span>✉️ Professional Email Template</span>
                        <i class="fa-solid fa-arrow-right text-slate-500 group-hover:text-indigo-400 transition-transform group-hover:translate-x-1"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sticky Chat Input Bar -->
        <div class="sticky bottom-4">
            <form id="chat-form" onsubmit="handleChatSubmit(event)" class="relative flex items-center">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your question here..." 
                    required 
                    autocomplete="off"
                    class="w-full bg-slate-900/95 border border-slate-700/80 focus:border-indigo-500 rounded-2xl py-4 pl-5 pr-14 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 shadow-2xl backdrop-blur-xl transition"
                >
                <button 
                    type="submit" 
                    id="send-btn"
                    class="absolute right-2.5 top-2.5 bottom-2.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white rounded-xl font-medium transition flex items-center justify-center shadow-md shadow-indigo-600/30"
                >
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
            <div class="flex justify-between items-center mt-2 px-3 text-[11px] text-slate-500">
                <span class="flex items-center gap-1"><i class="fa-solid fa-shield-halved text-emerald-400"></i> Secure Vercel Backend</span>
                <span id="speed-indicator">Response Speed: Instant</span>
            </div>
        </div>
    </main>

    <!-- AdSense Bottom Banner Container -->
    <div class="max-w-4xl mx-auto w-full px-4 mb-6">
        <div class="p-3 border border-dashed border-slate-800 bg-slate-900/30 rounded-xl text-center">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-format="fluid"
                 data-ad-layout-key="-fb+5w+4e-db+86"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="0987654321"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-900">
        &copy; 2026 Bilal Abid AI. All rights reserved.
    </footer>

    <!-- App Frontend Logic -->
    <script>
        function sendQuickPrompt(promptText) {
            document.getElementById('user-input').value = promptText;
            handleChatSubmit(new Event('submit'));
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const inputEl = document.getElementById('user-input');
            const prompt = inputEl.value.trim();
            if (!prompt) return;

            appendMessage('user', prompt);
            inputEl.value = '';

            const loadingId = appendLoadingIndicator();
            const startTime = performance.now();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (data.error) throw new Error(data.error.message || data.error);

                const duration = ((performance.now() - startTime) / 1000).toFixed(2);
                document.getElementById('speed-indicator').innerText = `Response Speed: ${duration}s`;

                const aiAnswer = data.candidates[0].content.parts[0].text;
                appendMessage('ai', aiAnswer);
            } catch (err) {
                removeMessage(loadingId);
                appendMessage('ai', '⚠️ Error fetching response: ' + err.message);
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} animate-fade-in`;

            const bubbleClass = sender === 'user' 
                ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%] shadow-lg text-sm'
                : 'glass-panel text-slate-200 rounded-2xl rounded-tl-none px-5 py-4 max-w-[90%] border border-slate-800 shadow-xl text-sm leading-relaxed prose prose-invert';

            const formattedContent = sender === 'ai' ? marked.parse(text) : escapeHtml(text);

            msgDiv.innerHTML = `
                <div class="${bubbleClass}">
                    ${sender === 'ai' ? '<div class="text-[10px] font-bold text-indigo-400 mb-1.5 uppercase tracking-wider flex items-center gap-1.5"><i class="fa-solid fa-robot"></i> Bilal Abid AI</div>' : ''}
                    <div>${formattedContent}</div>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (sender === 'ai') {
                document.querySelectorAll('pre code').forEach((el) => {
                    hljs.highlightElement(el);
                });
            }
        }

        function appendLoadingIndicator() {
            const chatBox = document.getElementById('chat-box');
            const id = 'loading-' + Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = 'flex justify-start';
            msgDiv.innerHTML = `
                <div class="glass-panel text-slate-400 rounded-2xl rounded-tl-none px-4 py-3 border border-slate-800 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-400"></i> Thinking fast...
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
